<!doctype html>
<!-- Source for assets/board.png and assets/board-dark.png (900x330 at 2x).
     Serve this folder locally, then screenshot with headless Chrome:
       chrome --headless=new --force-device-scale-factor=2 --window-size=900,330 \
         --virtual-time-budget=6000 --screenshot=board.png http://localhost:8000/banner.html
     Add #dark to the URL for the dark version. --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=JetBrains+Mono:wght@400;500;700&display=block">
<style>
:root{--bg:#fafaf5;--dot:rgba(26,26,26,.08);--ink:#1a1a1a;--soft:#4a4a4a;--rule:rgba(26,26,26,.16);--sage:#55705a;--rust:#b4532a;--shadow:#1a1a1a}
.dark{--bg:#10130f;--dot:rgba(232,230,220,.07);--ink:#e8e6dc;--soft:#b4b2ab;--rule:rgba(232,230,220,.18);--sage:#9db89f;--rust:#e08a5c;--shadow:#e8e6dc}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:900px;height:330px;overflow:hidden}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:16px 16px;color:var(--ink);padding:32px 40px;position:relative}
.mono{font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.16em;font-weight:500}
.meta{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--rule);font-size:11px;color:var(--soft)}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:VT323,monospace;font-weight:400;font-size:26px;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
.brand i{width:11px;height:11px;background:var(--rust);display:block}
.brand span{margin-left:8px}
.clock{color:var(--sage)}
.main{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
h1{font-family:VT323,monospace;font-weight:400;font-size:66px;line-height:.86;letter-spacing:.02em;text-transform:uppercase;color:var(--sage);width:520px}
.card{width:250px;border:1px solid var(--ink);background:var(--bg);box-shadow:4px 4px 0 var(--shadow)}
.card .bar{padding:8px 12px;border-bottom:1px solid var(--rule);font-size:9.5px;color:var(--sage)}
.row{padding:10px 12px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px}
.row:last-child{border-bottom:0}
.row b{font-family:VT323,monospace;font-weight:400;font-size:38px;line-height:.85;color:var(--rust);min-width:84px;padding-bottom:3px}
.row span{font-size:9.5px;letter-spacing:.1em;color:var(--soft);line-height:1.4}
.url{position:absolute;left:40px;bottom:30px;font-size:12px;color:var(--ink)}
.url em{font-style:normal;color:var(--rust)}
</style></head><body>
<script>if(location.hash==="#dark")document.documentElement.className="dark"</script>
<div class="meta"><span class="brand"><i></i><b>Muhammad Abubakar</b><span class="mono">Senior Data Scientist at Addo AI</span></span><span class="mono clock">Islamabad · UTC+5</span></div>
<div class="main">
  <h1>I take generative AI from pilot to production.</h1>
  <div class="card">
    <div class="bar mono">In production · measured</div>
    <div class="row"><b>−68%</b><span class="mono">BI analyst requests</span></div>
    <div class="row"><b>−89%</b><span class="mono">HR tickets</span></div>
  </div>
</div>
<p class="url mono"><em>&gt;</em> abubakarjutt.github.io</p>
</body></html>
