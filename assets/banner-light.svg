<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal window. Command: whoami. Output: Muhammad Abubakar, Senior AI/ML Engineer, Production GenAI and Agentic Systems, six-plus years shipping AI that survives contact with production.">
  <title>Muhammad Abubakar — Senior AI/ML Engineer, Production GenAI &amp; Agentic Systems</title>
  <defs>
    <clipPath id="win-l">
      <rect x="0" y="0" width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#win-l)">
    <rect width="1200" height="320" fill="#F4F7F5"/>

    <!-- title bar -->
    <rect width="1200" height="44" fill="#E7EEE9"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#D3DED7" stroke-width="1"/>
    <circle cx="28" cy="22" r="6" fill="#FF5F56"/>
    <circle cx="50" cy="22" r="6" fill="#FFBD2E"/>
    <circle cx="72" cy="22" r="6" fill="#27C93F"/>
    <text x="600" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#3C6152">muhammad@production: ~</text>

    <!-- body -->
    <text x="40" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#3C6152">guest@github:~$ <tspan fill="#146C43" font-weight="600">whoami</tspan></text>

    <text x="40" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="46" fill="#0F5132">Muhammad Abubakar</text>

    <text x="40" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#3C6152">Senior AI/ML Engineer — Production GenAI &amp; Agentic Systems</text>

    <text x="40" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#3C6152">6+ yrs shipping AI that survives contact with production</text>

    <text x="40" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5C8571">LangGraph · AWS Bedrock · RAG · Text-to-SQL · MLOps</text>

    <text x="40" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#3C6152">guest@github:~$</text>
    <rect x="218" y="288" width="11" height="18" fill="#146C43">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.45;0.9;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="15.25" fill="none" stroke="#D3DED7" stroke-width="1.5"/>
